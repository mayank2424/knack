<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Tallyhouse</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    /* The sign-in page only uses the brand and large-radius tokens. */
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font: 15px/1.5 var(--font); color: #fff; background: linear-gradient(160deg, var(--brand-strong), #134e4a 60%, #042f2e); display: grid; place-items: center; padding: 24px 16px; }
    .card { width: 100%; max-width: 380px; background: #fff; color: #0b1f1e; border-radius: var(--radius-lg); padding: 32px 28px; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .5); }
    .mark { display: flex; align-items: center; gap: 9px; font-weight: 750; font-size: 17px; margin-bottom: 22px; }
    .mark i { width: 26px; height: 26px; border-radius: 7px; background: var(--brand); display: grid; place-items: center; color: #fff; font-style: normal; font-size: 13px; }
    h1 { font-size: 22px; letter-spacing: -0.02em; margin: 0 0 4px; }
    .lede { margin: 0 0 22px; color: #3f5553; font-size: 14px; }
    label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    input { width: 100%; font: inherit; padding: 11px 13px; border: 1.5px solid #b8cfcc; border-radius: 12px; margin-bottom: 16px; }
    button { width: 100%; font: inherit; font-weight: 650; padding: 12px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; }
    .alt { text-align: center; font-size: 14px; margin: 18px 0 0; color: #3f5553; }
    .alt a { color: var(--brand); font-weight: 600; }
    .legal { margin-top: 22px; font-size: 12px; color: rgba(255, 255, 255, .7); text-align: center; }
  </style>
</head>
<body>
  <div>
    <main class="card">
      <div class="mark"><i>T</i>Tallyhouse</div>
      <h1>Welcome back</h1>
      <p class="lede">Sign in to send invoices and see who has paid.</p>
      <form onsubmit="return false">
        <label for="em">Work email</label>
        <input id="em" type="email" value="priya@junipervale.example">
        <label for="pw">Password</label>
        <input id="pw" type="password" value="example-only">
        <button type="submit">Sign in</button>
      </form>
      <p class="alt">New here? <a href="#">Start a 30-day trial</a></p>
    </main>
    <p class="legal">Tallyhouse is a fictional demo app.</p>
  </div>
</body>
</html>
