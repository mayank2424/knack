<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="description" content="Logo sting / intro: shapes converge, mark draws on, wordmark reveals (16:9, 4s, loopable outro)" />
<title>Logo sting</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet" />
<script src="motion.js"></script>
<style>
  :root { --bg: #f5f2ea; --ink: #121212; --a: #ff4d2e; --b: #2e5bff; --c: #ffc22e; }
  #stage { background: var(--bg); font-family: 'Space Grotesk', sans-serif; color: var(--ink); }
  .center { position: absolute; left: 50%; top: 50%; }
  .dot { position: absolute; width: 90px; height: 90px; border-radius: 50%; margin: -45px 0 0 -45px; }
  svg.mark { position: absolute; width: 260px; height: 260px; margin: -130px 0 0 -130px; overflow: visible; }
  svg.mark path { fill: none; stroke: var(--ink); stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; }
  .word { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: nowrap;
    font-size: 132px; font-weight: 700; letter-spacing: -0.04em; }
  .word .clip { display: inline-block; overflow: hidden; vertical-align: bottom; }
  .sub { position: absolute; left: 50%; top: 50%; margin-top: 108px; transform: translateX(-50%); font-size: 32px; font-weight: 500;
    letter-spacing: 0.32em; text-transform: uppercase; white-space: nowrap; color: #5d5a54; /* 5.9:1 on the cream bg */ }
  /* Impact shockwave: a thin ring that expands and fades where the dots collide. */
  .ring { position: absolute; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%; border: 3px solid var(--ink); opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div class="center" id="dots">
    <div class="dot" id="d1" style="background: var(--a)"></div>
    <div class="dot" id="d2" style="background: var(--b)"></div>
    <div class="dot" id="d3" style="background: var(--c)"></div>
    <div class="ring" id="ring"></div>
  </div>
  <div class="center" id="markWrap">
    <!-- Replace with your own mark: any stroked SVG paths will "draw on". -->
    <svg class="mark" viewBox="0 0 260 260"><path id="p1" d="M60 40 V220" /><path id="p2" d="M200 40 L80 140 L200 220" /></svg>
  </div>
  <div class="word" id="word"><span class="clip"><span id="wm">Knack</span></span></div>
  <div class="sub" id="sub">Studio</div>
</div>
<script>
  Motion.config({ width: 1920, height: 1080, fps: 60, duration: 4, background: '#f5f2ea' });

  // Render this one with --motion-blur 8: fast converging dots read as motion, not as stutter.

  // 1 · Three dots sweep in on curved paths and collide at center (0–0.85s).
  const starts = [[-760, -240], [760, 280], [60, -640]];
  ['#d1', '#d2', '#d3'].forEach((sel, i) => {
    Motion.to(sel, { start: 0.04 * i, duration: 0.78, ease: 'inOutCubic', from: { x: starts[i][0], scale: 0.7 }, to: { x: 0, scale: 1 } });
    Motion.to(sel, { start: 0.04 * i, duration: 0.78, ease: 'inQuad', from: { y: starts[i][1] }, to: { y: 0 } }); // different curve on y = an arc
  });
  // Impact (0.86s): dots shrink into the mark while a shockwave ring expands and fades. Nothing scales from or to 0.
  Motion.to(['#d1', '#d2', '#d3'], { start: 0.86, duration: 0.22, ease: 'inCubic', to: { scale: 0.3, opacity: 0 } });
  // (Before its first tween a property holds that tween's `from`, so the ring fades in over 2 frames instead of starting at 0.9.)
  Motion.to('#ring', { start: 0.84, duration: 0.04, from: { opacity: 0 }, to: { opacity: 0.9 } });
  Motion.to('#ring', { start: 0.88, duration: 0.7, ease: 'strong', from: { scale: 0.35 }, to: { scale: 1.9, opacity: 0 } });

  // 2 · Mark draws on with overlap between strokes (1.0–1.9s).
  Motion.draw('#p1', { start: 0.9, duration: 0.45, ease: 'outCubic' });
  Motion.draw('#p2', { start: 1.05, duration: 0.65, ease: 'inOutCubic' });
  // One confident overshoot (damping 16), the only spring in the piece.
  Motion.to('#markWrap', { start: 0.9, duration: 0.9, ease: { stiffness: 180, damping: 16 }, from: { scale: 0.7, rotate: -10 }, to: { scale: 1, rotate: 0 } });

  // 3 · Mark slides left; wordmark wipes out from behind it (2.0–2.8s).
  Motion.to('#markWrap', { start: 2.0, duration: 0.7, ease: 'snappy', to: { x: -260, scale: 0.62 } });
  Motion.to('#word', { start: 2.0, duration: 0.7, ease: 'snappy', from: { x: 0 }, to: { x: 90 } });
  Motion.from('#wm', { x: -420, opacity: 0 }, { start: 2.08, duration: 0.7, ease: 'snappy' });
  Motion.to('#sub', { start: 2.5, duration: 0.6, ease: 'strong', from: { opacity: 0, y: 14, x: 90 }, to: { opacity: 1, y: 0, x: 90 } });
  Motion.to('#sub', { start: 2.5, duration: 1.4, ease: 'outCubic', from: { letterSpacing: '0.6em' }, to: { letterSpacing: '0.3em' } });
  // Hold the final lockup ~1.2s; stings should end on a clean, still frame.
</script>
</body>
</html>
